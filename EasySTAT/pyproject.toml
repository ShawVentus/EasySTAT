[project]
name = "financial_crew"
version = "0.1.0"
description = "financial_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "akshare>=1.13.0",
    "tenacity>=8.2.0",
    "joblib>=1.3.0"
]

[project.scripts]
financial_crew = "financial_crew.main:run"
run_crew = "financial_crew.main:run"
train = "financial_crew.main:train"
replay = "financial_crew.main:replay"
test = "financial_crew.main:test"
run_with_trigger = "financial_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
